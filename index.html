<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FilaCero · Avanza tu trámite, no tu espera</title>
<meta name="description" content="FilaCero: agenda tu cita, revisa requisitos y da seguimiento a tus trámites universitarios sin hacer fila.">
<meta name="theme-color" content="#12306B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2FB;--g1:#BFF0DC;--g2:#D5CCFA;--g3:#FFE0CC;--card:rgba(255,255,255,.6);--bd:rgba(255,255,255,.9);--ink:#0E1A36;--mut:#5A6683;--navy:#0E1A36;--gold:#F5B83D;--mint:#7ED6B0;--amb:#F5B83D;--cor:#FF8A73;--lav:#CFC8F7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080F20;--g1:#0F3B3A;--g2:#2A2563;--g3:#3A2330;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.13);--ink:#EDF1FC;--mut:#9AA6C4}}
:root[data-theme="dark"]{--bg:#080F20;--g1:#0F3B3A;--g2:#2A2563;--g3:#3A2330;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.13);--ink:#EDF1FC;--mut:#9AA6C4}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:390px;height:min(820px,100%);border-radius:40px;overflow:hidden;box-shadow:0 24px 70px rgba(14,26,54,.35);display:flex;flex-direction:column;background:radial-gradient(90% 40% at 0% 0%,var(--g1),transparent 70%),radial-gradient(80% 40% at 100% 25%,var(--g2),transparent 70%),radial-gradient(90% 35% at 20% 100%,var(--g3),transparent 70%),var(--bg)}
@media(max-width:500px){.phone{width:100%;height:100%;border-radius:0;box-shadow:none}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.glass{background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:28px}
.pp{transform:translate(calc(var(--ex,0)*1px),calc(var(--ey,0)*1px))}
.blink{transform-origin:50px 46px;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
/* splash */
#splash{position:absolute;inset:0;z-index:6;color:#fff;background:radial-gradient(80% 45% at 50% 100%,rgba(245,184,61,.4),transparent 70%),#0E1A36;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;transition:transform .8s cubic-bezier(.7,0,.2,1)}
#splash.out{transform:translateY(-102%)}
.count{font-size:170px;font-weight:800;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:-6px}
.crowd{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:250px}
.crowd i{width:12px;height:20px;border-radius:6px 6px 3px 3px;background:#fff;opacity:.8;transition:all .35s}
.crowd i.gone{transform:translateY(-14px) scale(0);opacity:0}
.lbl{opacity:.7}
.hero{display:none;flex-direction:column;align-items:center;gap:8px}
#splash.done .hero{display:flex}
#splash.done .count,#splash.done .crowd,#splash.done .lbl{display:none}
.hero .logo{width:min(310px,80vw);border-radius:24px;animation:pop .9s cubic-bezier(.2,1.6,.4,1)}
#splash.done{background:#fff;color:#12306B}
#splash.done .go{background:#12306B;color:#fff}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}}
.hero h1{font-size:54px;font-weight:800;letter-spacing:-2px}
.hero p{opacity:.8;font-size:17px}
.go{margin-top:20px;background:#fff;color:#0E1A36;font-weight:700;padding:8px 8px 8px 30px;border-radius:99px;font-size:18px;display:flex;align-items:center;gap:18px}
.go b{width:44px;height:44px;border-radius:50%;background:var(--gold);display:grid;place-items:center}
/* shell */
.top{display:flex;align-items:center;gap:8px;padding:18px 22px 4px}
.top .m{width:34px}
.top strong{font-size:19px;font-weight:800;letter-spacing:-.5px;flex:1}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:16px}
main{flex:1;overflow-y:auto;padding:8px 20px 110px;display:flex;flex-direction:column;gap:18px}
main.chatm{padding-bottom:170px}
.h1{font-size:36px;font-weight:700;letter-spacing:-1.5px;line-height:1.04}
h3{font-size:18px;font-weight:700}
.muted{color:var(--mut);font-size:14px}
nav{position:absolute;left:18px;right:18px;bottom:calc(14px + env(safe-area-inset-bottom,0px));height:66px;background:#0E1A36;border:1px solid rgba(255,255,255,.14);border-radius:99px;display:flex;align-items:center;justify-content:space-around;padding:0 10px;box-shadow:0 12px 30px rgba(14,26,54,.35)}
nav button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.6);transition:all .3s}
nav button[aria-current="true"]{background:var(--gold);color:#0E1A36;transform:translateY(-2px) scale(1.08)}
/* turn */
.turn{display:flex;align-items:center;gap:18px;padding:18px;background:#0E1A36;color:#fff;border-color:rgba(255,255,255,.1)}
.turn .t{font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-1px}
.turn small{opacity:.7;font-size:14px;display:block;margin-top:6px}
.ring text{font-family:inherit}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.week{display:flex;justify-content:space-between}
.dc{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.dc i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:16px;color:#0E1A36;transition:transform .25s}
.dc.on i{transform:scale(1.2);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.dc.on{color:var(--ink);font-weight:700}
.leg{display:flex;gap:14px;font-size:13px;color:var(--mut)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 4px}
.tc{min-width:210px;border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:26px;scroll-snap-align:start;color:#0E1A36}
.tc b{font-size:22px;letter-spacing:-.5px}
.pb{height:6px;border-radius:6px;background:rgba(14,26,54,.15);overflow:hidden}
.pb u{display:block;height:100%;background:#0E1A36;border-radius:6px;transition:width .6s}
.cta{width:100%;background:var(--ink);color:var(--bg);font-weight:700;font-size:17px;padding:17px;border-radius:99px}
.cta[disabled]{opacity:.35;cursor:not-allowed}
.cta.alt{background:var(--card);color:var(--ink);border:1px solid var(--bd)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sl{padding:14px 0;border-radius:99px;text-align:center;font-weight:600;background:var(--card);border:1px solid var(--bd)}
.sl[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sl[disabled]{opacity:.35;text-decoration:line-through;cursor:not-allowed}
/* chat */
.ow{display:flex;justify-content:center}
.ow svg{width:120px;animation:float 3.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.msg{max-width:88%;padding:13px 16px;border-radius:22px;line-height:1.45;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;border-bottom-left-radius:6px}
.msg ul{margin:8px 0 8px 18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 16px;border-radius:99px;font-size:14px;background:var(--card);border:1px solid var(--bd)}
.say{position:absolute;left:18px;right:18px;bottom:94px;display:flex;gap:8px;padding:8px;z-index:3;border-radius:99px}
.say input{flex:1;font:inherit;padding:10px 14px;border:0;background:transparent;color:var(--ink)}
.say button{width:44px;height:44px;border-radius:50%;background:var(--gold);color:#0E1A36;font-weight:800}
/* track */
.step{display:flex;gap:14px;position:relative;padding-bottom:24px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:3px;background:var(--bd);border-radius:3px}
.step.done::before{background:var(--mint)}
.step:last-child::before{display:none}
.dot{width:28px;height:28px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-size:13px;flex:none;z-index:1;color:#0E1A36}
.step.done .dot{background:var(--mint)}
.step.now .dot{background:var(--gold);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,184,61,.6)}100%{box-shadow:0 0 0 12px rgba(245,184,61,0)}}
.step b{display:block}
.toast{position:absolute;left:20px;right:20px;bottom:96px;background:var(--ink);color:var(--bg);padding:14px 18px;border-radius:22px;transform:translateY(200%);transition:transform .4s;z-index:7}
.toast.show{transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.ld{width:120px;height:4px;border-radius:4px;background:rgba(18,48,107,.15);overflow:hidden;margin-top:18px}
.ld u{display:block;height:100%;background:#FDB913;animation:ld 2s linear forwards}
@keyframes ld{from{width:0}to{width:100%}}
#auth{position:absolute;inset:0;z-index:5;overflow-y:auto;padding:calc(28px + env(safe-area-inset-top,0px)) 24px 28px;background:inherit;transition:transform .7s cubic-bezier(.7,0,.2,1)}
#auth.out{transform:translateY(-102%)}
.ab{display:flex;flex-direction:column;gap:16px;max-width:360px;margin:0 auto}
.ab>img{width:72px;height:72px;border-radius:50%;box-shadow:0 8px 24px rgba(14,26,54,.2)}
.seg{display:flex;padding:5px;border-radius:99px;background:var(--card);border:1px solid var(--bd)}
.seg button{flex:1;padding:11px;border-radius:99px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mut)}
.fld input{font:inherit;font-size:16px;padding:14px 16px;border-radius:18px;border:1px solid var(--bd);background:var(--card);color:var(--ink)}
.err{color:#C73A25;font-size:14px;min-height:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#FF9C8A}}
:root[data-theme="dark"] .err{color:#FF9C8A}
.lnk{color:var(--mut);text-decoration:underline;font-size:14px;align-self:center;padding:6px}
.row2{display:flex;gap:10px}.row2 .cta{padding:16px 10px;font-size:16px}
.tc{text-align:left}
.sec b{text-align:right}
.stp{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.stp div{display:flex;align-items:center;gap:8px;font-weight:600}
.stp u{text-decoration:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--bd);color:var(--ink);font-size:12px}
.stp .done u{background:var(--mint);color:#0E1A36}
.stp .cur u{background:var(--gold);color:#0E1A36}
.stp .cur{color:var(--ink)}
.stp hr{flex:1;border:0;height:2px;background:var(--bd);margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal b{font-size:12px;color:var(--mut);font-weight:600}
.cd{aspect-ratio:1;display:grid;place-items:center;padding:0}
.cd span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;color:#0E1A36}
.cd:disabled{cursor:not-allowed}
.cd:disabled span{color:var(--mut);opacity:.45}
.cd.on span{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.cd.today span{outline:2px dashed var(--mut);outline-offset:-2px}
.srch{display:flex;align-items:center;gap:10px;padding:0 18px;border-radius:99px;color:var(--mut)}
.srch input{flex:1;font:inherit;font-size:16px;border:0;background:transparent;padding:15px 0;color:var(--ink)}
.srch input:focus-visible{outline:none}
.srch:focus-within{outline:3px solid var(--gold)}
.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;color:var(--ink)}
.li i{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-style:normal;font-weight:800;color:#0E1A36;font-size:18px;flex:none}
.seeg{display:flex;align-items:center;gap:10px;padding:16px 18px;border-radius:24px;color:var(--ink)}
.pill{font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--bd)}
.dr{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 0;border-top:1px solid var(--bd)}
.up{padding:8px 16px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;flex:none}
.up.on{background:var(--mint);color:#0E1A36}
.aviso{display:flex;gap:12px;align-items:center;padding:16px 18px;border-radius:24px;background:#FDE9B8;color:#0E1A36}
.info{display:flex;gap:12px;align-items:center;padding:16px 18px;border-radius:22px;background:#DCE9FF;color:#0E1A36}
.info svg{flex:none}
.okh{display:flex;flex-direction:column;align-items:center;gap:12px}
.okc{width:96px;height:96px;border-radius:50%;background:var(--mint);color:#0E1A36;display:grid;place-items:center;animation:pop2 .7s cubic-bezier(.2,1.6,.4,1)}
.okc svg{width:48px;height:48px;stroke-width:3}
@keyframes pop2{from{transform:scale(0)}}
.fab{position:absolute;right:20px;bottom:98px;width:58px;height:58px;border-radius:50%;padding:7px;z-index:3;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 24px rgba(14,26,54,.25)}
.fab[hidden]{display:none}
.fab svg{animation:float 3.5s ease-in-out infinite}
#onb{position:absolute;inset:0;z-index:5;background:inherit;display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));transition:transform .7s cubic-bezier(.7,0,.2,1)}
#onb.out{transform:translateY(-102%)}
.skip{align-self:flex-end;color:var(--mut);padding:8px 4px}
.oi{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:in .45s}
.obc{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--lav),var(--mint));color:#0E1A36;box-shadow:0 20px 50px rgba(14,26,54,.15)}
.obc svg{width:84px;height:84px}
.ofoot{display:flex;align-items:center;justify-content:space-between}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:8px;background:rgba(127,140,170,.4);transition:all .3s}
.dots i.on{width:26px;background:var(--ink)}
:root{--na:#C3C9D6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--na:#3B4766}}
:root[data-theme="dark"]{--na:#3B4766}
.dc i.na,.cd span.na{color:var(--ink);background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(255,255,255,.35) 4px 6px)}
.hat{background-image:repeating-linear-gradient(45deg,transparent 0 3px,rgba(255,255,255,.5) 3px 5px)}
.leg{flex-wrap:wrap}

.who,.brand{display:none}
nav em{display:none;font-style:normal}
.cols,.col{display:contents}
@media (min-width:900px){
.phone{width:100%;height:100%;border-radius:0;box-shadow:none;display:grid;grid-template-columns:260px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.top{grid-column:1/-1;padding:20px 32px 8px}
.top .m{width:42px}
.top strong{font-size:24px;flex:none}
.who{display:block;flex:1;text-align:right;color:var(--mut);font-size:15px;padding-right:6px}
nav{position:static;grid-column:1;grid-row:2;align-self:start;margin:12px 0 0 28px;height:auto;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:6px;padding:14px;border-radius:32px}
nav button{width:auto;height:auto;border-radius:20px;display:flex;align-items:center;gap:12px;padding:13px 16px;font-weight:600;font-size:16px}
nav button em{display:inline}
nav button[aria-current="true"]{transform:none}
main{grid-column:2;grid-row:2;padding:16px max(32px,calc((100% - 1080px)/2)) 40px}
main.narrow{padding-left:max(32px,calc((100% - 760px)/2));padding-right:max(32px,calc((100% - 760px)/2))}
main.chatm{padding-bottom:120px}
.h1{font-size:44px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.rail{margin:0;padding:0;flex-wrap:wrap;overflow:visible}
.tc{min-width:260px}
.say{left:260px;right:0;bottom:28px;max-width:760px;margin:0 auto}
.fab{right:32px;bottom:32px}
.toast{left:auto;right:32px;bottom:32px;width:380px}
#auth{display:grid;grid-template-columns:1fr 1fr;align-content:center;align-items:center;padding:0}
.brand{display:flex;flex-direction:column;align-items:center;gap:22px;padding:48px;text-align:center}
.brand img{width:min(440px,90%);border-radius:32px;box-shadow:0 24px 60px rgba(14,26,54,.18)}
.brand p{font-size:20px;color:var(--mut);max-width:360px}
.ab{padding:32px;width:100%;max-width:420px}
.cal{max-width:430px;margin:0 auto}
.toast{transform:translateY(400%)}
.toast.show{transform:none}
.ab>img{display:none}
#onb .oi,#onb .ofoot{width:100%;max-width:560px;margin:0 auto}
}
</style>
</head>
<body>
<div class="phone" id="app">

return `<div><p class="muted" style="margin-bottom:6px">Hola, ${me?me.name.split(' ')[0]:''} · Matrícula ${me?me.mat:''}</p><h1 class="h1">¿Qué trámite hacemos hoy?</h1></div>
<div class="cols"><div class="col"><div class="glass turn"><svg class="ring" width="124" height="124" viewBox="0 0 124 124" aria-hidden="true"><circle cx="62" cy="62" r="50" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="10"/><circle cx="62" cy="62" r="50" fill="none" stroke="#F5B83D" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*pr} ${C}" transform="rotate(-90 62 62)" style="transition:stroke-dasharray .8s"/><text x="62" y="60" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">A-14</text><text x="62" y="80" text-anchor="middle" fill="#fff" opacity=".7" font-size="13">${S.pos>0?S.pos*4+' min':'¡Ya!'}</text></svg>
<div><div class="t">${S.pos>0?'Faltan '+S.pos+' personas':'¡Es tu turno!'}</div><small>${S.booked?'Cita: '+sh(S.booked):'Turno de ejemplo'}. Espera donde quieras.</small></div></div>
<div class="row2"><button class="cta" data-go="tram">Iniciar un trámite</button><button class="cta alt" data-go="cita">Agendar cita</button></div></div><div class="col">
<div><h3>Demanda esta semana</h3><p class="muted" style="margin:4px 0 14px">Toca un día para agendar. Los verdes tienen menos fila.</p>${week()}</div>
<div class="aviso"><span style="font-size:26px">📢</span><div><b>Avisos de la coordinación</b><div style="font-size:14px;margin-top:2px">Del 16 al 20 de noviembre se reciben solicitudes de sobrecupo.</div></div></div>
<div class="info"><span style="font-size:22px">🗓️</span><div><b>Cambio de disponibilidad</b><div style="font-size:14px;margin-top:2px">El coordinador no estará el jueves 19 (junta de academia). Si tenías cita, la reprogramamos y te avisamos.</div></div></div></div></div>
<div><h3 style="margin-bottom:12px">Tus trámites</h3><div class="rail">
<button class="tc" data-go="track" style="background:var(--lav)"><div><small>Sobrecupo</small><br><b>${STEPS[S.step]}</b></div><div class="pb"><u style="width:${(S.step+1)*20}%"></u></div></button>
<button class="tc" data-go="track" style="background:var(--mint)"><div><small>Justificante</small><br><b>Listo para recoger</b></div><div class="pb"><u style="width:100%"></u></div></button></div></div>`}
function chat(){return `<div class="ow">${owl()}</div><h1 class="h1" style="text-align:center;font-size:28px">Pregúntale al búho</h1>`+S.chat.map(m=>`<div class="msg ${m.b?'bot glass':'me'}">${m.h}</div>`).join('')+(S.qr?`<div class="chips"><button class="chip" data-yes="1">Sí, empezar</button><button class="chip" data-no="1">No, gracias</button></div>`:`<div class="chips">${['Quiero un sobrecupo','Necesito una baja','Justificante por enfermedad'].map(c=>`<button class="chip" data-ask="${c}">${c}</button>`).join('')}</div>`)}
function ask(q){const n=q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');S.chat.push({h:q});
const k=n.includes('sobrecupo')?'sobrecupo':n.includes('baja')?'baja':/justific|enferm|falt/.test(n)?'justificante':n.includes('carga')?'carga':null;
if(k){const t=TR[k];S.chat.push({b:1,h:`Eso es <b>${t.n}</b>. ${MOD[t.m]}. Tarda ${t.t}.${t.d.length?`<ul>${t.d.map(x=>`<li>${x}</li>`).join('')}</ul>`:' La coordinación aún confirma los requisitos. '}¿Quieres iniciar este trámite?`});S.qr=k}
else{S.chat.push({b:1,h:'Todavía no reconozco ese trámite. Prueba con sobrecupo, baja extemporánea o justificante.'});S.qr=null}
render();const v=$('view');v.scrollTop=v.scrollHeight}
const lst=()=>{const q=(S.q||'').toLowerCase(),it=Object.entries(TR).filter(([k,t])=>t.n.toLowerCase().includes(q));return it.map(([k,t])=>`<button class="li glass" data-sel="${k}"><i style="background:${t.c}">${t.n[0]}</i><div style="flex:1;text-align:left"><b>${t.n}</b><div class="muted">${MOD[t.m]}</div></div>${icon('chev')}</button>`).join('')||'<p class="muted">No encontramos ese trámite. Pregúntale al búho.</p>'};
function tram(){return `<h1 class="h1">Trámites</h1><label class="srch glass">${icon('search')}<input id="sq" placeholder="Buscar trámite" value="${S.q||''}" aria-label="Buscar trámite"></label>
<button class="glass seeg" data-go="track"><div style="flex:1;text-align:left"><b>Mi sobrecupo</b><div class="muted">${STEPS[S.step]}</div></div><span class="pill">Ver seguimiento</span></button><div class="list" id="lst">${lst()}</div>`}
function det(){const k=S.sel,t=TR[k],u=S.up[k]||{},all=t.d.length&&t.d.every((_,i)=>u[i]);
return `<button class="chip" data-go="tram" style="align-self:flex-start">← Trámites</button><h1 class="h1">${t.n}</h1><div class="chips"><span class="pill">${MOD[t.m]}</span><span class="pill">${t.t}</span></div>
${t.d.length?`<div class="glass" style="padding:18px"><h3>Documentos que necesitas</h3><p class="muted" style="margin:4px 0 12px">Súbelos aquí. Revisamos formato y peso antes de agendar.</p>${t.d.map((x,i)=>`<div class="dr"><span>${x}</span><button class="up ${u[i]?'on':''}" data-up="${i}">${u[i]?'Listo ✓':'Subir'}</button></div>`).join('')}</div>`:'<div class="glass" style="padding:18px"><p class="muted">La coordinación todavía confirma los requisitos de este trámite.</p></div>'}
<button class="cta" data-start="1" ${t.d.length&&!all?'disabled':''}>${t.m==='o'?'Enviar solicitud':t.d.length?'Agendar cita':'Avisarme cuando esté listo'}</button>`}
function cita(){const t=TR[S.tram],d=S.day,wl=d&&LVL(d)==='f',na=d&&LVL(d)==='n',f=[true,!!d,S.slot!==null],cur=f.indexOf(false),rec=[16,17,18,19,20].find(x=>LVL(x)==='l');
return `<h1 class="h1">Agenda tu cita</h1><div class="cols"><div class="col"><div class="stp">${['Trámite','Fecha','Hora'].map((x,i)=>`<div class="${f[i]?'done':i===cur?'cur':''}"><u>${f[i]?'✓':i+1}</u>${x}</div>`).join('<hr>')}</div>
<div class="glass" style="padding:14px 18px"><div class="sec"><b>${t.n}</b><button class="chip" data-go="tram">Cambiar</button></div></div>
<div class="glass" style="padding:18px"><h3 style="margin-bottom:12px">Noviembre 2026</h3>${cal()}<div style="margin:14px 0 10px">${legend()}</div><button class="chip" data-day="${rec}">Menos fila: ${fmt(rec)}</button></div></div><div class="col">
${!d?'':na?'<div class="info"><span style="font-size:22px">🗓️</span><div><b>El coordinador no estará disponible</b><div style="font-size:14px;margin-top:2px">'+NA[d]+'. Elige otro día: no hay citas ese día.</div></div></div>':wl?'<div><p class="muted" style="margin-bottom:14px">Ese día está lleno. Únete a la lista de espera y te avisamos si se libera un horario.</p><button class="cta alt" data-wait="1">'+(S.wait?'En lista de espera ✓':'Unirme a la lista de espera')+'</button></div>':'<div><h3 style="margin-bottom:12px">Horarios del '+fmt(d)+'</h3><div class="slots">'+SLOTS.map((s,i)=>`<button class="sl" data-slot="${i}" ${full(d,i)?'disabled':''} aria-pressed="${S.slot===i}">${s}</button>`).join('')+'</div></div>'}
<p class="muted">Antes de confirmar revisamos que tus documentos estén completos.</p><button class="cta" data-book="1" ${S.slot===null||wl||na||!d?'disabled':''}>Confirmar cita</button></div></div>`}
function qr(){const b=S.booked;let r='',k=b.d*31+b.s*7+11;const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#0E1A36"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#0E1A36"/>`;
for(let y=0;y<21;y++)for(let x=0;x<21;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;k=(k*1103515245+12345)&0x7fffffff;if(k%3===0)r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#0E1A36"/>`}
return `<svg viewBox="0 0 21 21" width="104" height="104" style="background:#fff;padding:6px;border-radius:14px;flex:none" role="img" aria-label="Código QR de tu cita" shape-rendering="crispEdges">${r}${f(0,0)}${f(14,0)}${f(0,14)}</svg>`}
function ok(){const t=TR[S.tram],b=S.booked;
return `<div class="okh"><div class="okc">${icon('ok')}</div><h1 class="h1" style="text-align:center">Cita confirmada</h1><p class="muted" style="text-align:center">Te avisaremos antes de que llegue tu turno.</p></div>
<div class="glass" style="padding:18px;display:flex;flex-direction:column;gap:12px"><div class="sec"><span class="muted">Trámite</span><b>${t.n}</b></div><div class="sec"><span class="muted">Fecha</span><b>${fmt(b.d)}</b></div><div class="sec"><span class="muted">Hora</span><b>${SLOTS[b.s]} a.m.</b></div><div class="sec"><span class="muted">Lugar</span><b>Coordinación de Ingeniería</b></div></div>
<div class="glass" style="padding:18px;display:flex;align-items:center;gap:16px">${qr()}<p class="muted">Muestra este código al llegar para registrar tu asistencia y tomar tu turno.</p></div>
<button class="cta" data-cal="1">Agregar al calendario</button><button class="cta alt" data-go="home">Ver mi turno</button>`}
function track(){return `<button class="chip" data-go="tram" style="align-self:flex-start">← Trámites</button><h1 class="h1">Sigue tu trámite</h1><div class="glass" style="padding:20px"><div style="display:flex;align-items:center;gap:14px;margin-bottom:22px"><div style="width:64px">${owl(S.step===4?'happy':'')}</div><div><h3>Sobrecupo</h3><p class="muted">${S.step===4?'¡Ya puedes recogerlo!':'Sin hacer fila para preguntar'}</p></div></div>${STEPS.map((s,i)=>`<div class="step ${i<S.step?'done':i===S.step?'now':''}"><div class="dot">${i<S.step?'✓':''}</div><div><b>${s}</b><span class="muted">${i===S.step?'Estás aquí':i<S.step?'Completado':'Pendiente'}</span></div></div>`).join('')}</div>
<div class="info">${icon('doc')}<div><b>Tiempo estimado</b><div style="font-size:14px">3 a 5 días hábiles</div></div></div><button class="cta alt" data-adv="1">Simular avance del coordinador</button>`}
const NAVOF={det:'tram',track:'tram',ok:'cita'};let lastTab='';
function render(){const v=$('view');v.className=(S.tab==='chat'?'chatm ':'')+(['home','tram','cita'].includes(S.tab)?'':'narrow');v.innerHTML={home,tram,det,cita,ok,track,chat}[S.tab]();
$('nav').innerHTML=[['home','Inicio','home'],['tram','Trámites','doc'],['cita','Citas','cita'],['chat','Búho','chat']].map(x=>`<button data-go="${x[0]}" aria-label="${x[1]}" aria-current="${(NAVOF[S.tab]||S.tab)===x[0]}">${icon(x[2])}<em>${x[1]}</em></button>`).join('');
$('fab').hidden=!['home','tram','track'].includes(S.tab);
if(lastTab!==S.tab){v.scrollTop=0;lastTab=S.tab}
let s=document.querySelector('.say');if(s)s.remove();
if(S.tab==='chat'){s=document.createElement('div');s.className='say glass';s.innerHTML='<input id="q" placeholder="Escribe tu duda…" aria-label="Tu duda"><button id="send" aria-label="Enviar">↑</button>';$('app').insertBefore(s,$('nav'));
const go=()=>{const x=$('q').value.trim();if(x)ask(x)};$('send').onclick=go;$('q').onkeydown=e=>{if(e.key==='Enter')go()}}
const sq=$('sq');if(sq)sq.oninput=()=>{S.q=sq.value;$('lst').innerHTML=lst()}}
$('app').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
if(d.go){S.tab=d.go;render()}else if(d.ask)ask(d.ask);
else if(d.day){S.day=+d.day;S.slot=null;S.tab='cita';render()}
else if(d.slot){S.slot=+d.slot;render()}
else if(d.sel){S.sel=d.sel;S.tab='det';render()}
else if('up' in d){const u=S.up[S.sel]=S.up[S.sel]||{};u[d.up]=!u[d.up];render()}
else if(d.start){const t2=TR[S.sel];if(!t2.d.length)toast('Te avisaremos cuando esté disponible.');else if(t2.m==='o'){toast('Solicitud enviada. Sigue su estado en Trámites.');S.tab='tram';render()}else{S.tram=S.sel;S.day=null;S.slot=null;S.tab='cita';render()}}
else if(d.wait){S.wait=true;render();toast('Estás en lista de espera. Te avisamos si se libera un horario.')}
else if(d.book){S.booked={d:S.day,s:S.slot};S.tab='ok';render()}
else if(d.cal)toast('Agregado a tu calendario.')
else if(d.yes){S.sel=S.qr;S.qr=null;S.tab='det';render()}
else if(d.no){S.chat.push({b:1,h:'Sin problema. Aquí sigo si me necesitas.'});S.qr=null;render();const v=$('view');v.scrollTop=v.scrollHeight}
else if(d.adv){S.step=(S.step+1)%STEPS.length;render();toast('Nuevo estado: '+STEPS[S.step])}});
$('fab').innerHTML=owl();$('fab').onclick=()=>{S.tab='chat';render()};
$('theme').onclick=()=>{const r=document.documentElement;const dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dk?'light':'dark'};
setInterval(()=>{if($('splash').classList.contains('out')&&me&&S.tab==='home'&&S.pos>0){S.pos--;render()}},7000);
const OB=[['cita','Agenda tu cita','Elige el trámite, la fecha y la hora que mejor te convenga.'],['doc','Revisa requisitos','Consulta y valida los documentos antes de tu cita.'],['pin','Da seguimiento','Conoce el estado de tu trámite en todo momento.']];
let ob=0;
function onb(){const o=OB[ob];$('onb').innerHTML=`<button class="skip" data-o="skip">Omitir</button><div class="oi"><div class="obc">${icon(o[0])}</div><h1 class="h1" style="text-align:center">${o[1]}</h1><p class="muted" style="text-align:center;font-size:17px;max-width:280px">${o[2]}</p></div><div class="ofoot"><div class="dots">${OB.map((_,i)=>`<i class="${i===ob?'on':''}"></i>`).join('')}</div><button class="cta" data-o="next" style="width:auto;padding:16px 34px">${ob===2?'Comenzar':'Siguiente'}</button></div>`}
$('onb').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.o==='skip'||ob===2)$('onb').classList.add('out');else{ob++;onb()}});
onb();
const U={'222200123':{name:'Ana Torres',mat:'222200123',mail:'a222200123@unison.mx',pass:'demo1234'}};
let me=null;const A={m:'login',step:'form',err:'',v:{},pend:null};
const MAT=/^\d{9}$/,MAIL=/^[^\s@]+@([a-z0-9-]+\.)*unison\.mx$/i;
const fld=(n,l,t,x)=>`<label class="fld"><span>${l}</span><input name="${n}" type="${t||'text'}" value="${(A.v[n]||'').replace(/"/g,'&quot;')}" ${x||''}></label>`;
function auth(){const lg=A.m==='login';let b;
if(A.step==='code')b=`<h1 class="h1">Revisa tu correo</h1><p class="muted">Enviamos un código de 6 dígitos a <b>${A.pend.mail}</b>. En este prototipo el código es 123456.</p>${fld('code','Código de verificación','text','inputmode="numeric" maxlength="6" autocomplete="one-time-code"')}<p class="err" role="alert">${A.err}</p><button class="cta" data-a="verify">Verificar y entrar</button><button class="lnk" data-a="back">Cambiar mis datos</button>`;
else b=`<h1 class="h1">Entra con tu cuenta de alumno</h1><p class="muted">Verificamos que eres alumno con tu correo institucional.</p><div class="seg"><button data-m="login" aria-pressed="${lg}">Iniciar sesión</button><button data-m="reg" aria-pressed="${!lg}">Crear cuenta</button></div>${lg?fld('mat','Matrícula','text','inputmode="numeric" maxlength="9" autocomplete="username"')+fld('pass','Contraseña','password','autocomplete="current-password"')+'<button class="lnk" data-a="forgot">¿Olvidaste tu contraseña?</button>':fld('name','Nombre completo','text','autocomplete="name"')+fld('mat','Matrícula','text','inputmode="numeric" maxlength="9"')+fld('mail','Correo institucional','email','placeholder="tu matrícula@unison.mx"')+fld('pass','Contraseña (mínimo 8 caracteres)','password','autocomplete="new-password"')}<p class="err" role="alert">${A.err}</p><button class="cta" data-a="${lg?'login':'reg'}">${lg?'Entrar':'Crear cuenta'}</button>${lg?'<button class="lnk" data-a="demo">Usar cuenta de demostración</button>':''}`;
$('auth').innerHTML=`<div class="brand"><img alt="FilaCero" src="${document.querySelector('.hero .logo').src}"><p>Tu cita, tu turno y el seguimiento de tus trámites en un solo lugar.</p></div><div class="ab"><img alt="" src="${$('topOwl').firstChild.src}">${b}</div>`}
function enter(u){me=u;$('who').textContent=u.name+' · '+u.mat;A.err='';A.v={};A.step='form';$('auth').classList.add('out');S.tab='home';S.day=null;S.slot=null;render();toast('Bienvenido, '+u.name.split(' ')[0])}
$('auth').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset,v=A.v;
if(d.m){A.m=d.m;A.err='';auth()}
else if(d.a==='login'){const mt=(v.mat||'').trim(),u=U[mt];A.err=!MAT.test(mt)?'La matrícula debe tener 9 dígitos.':!u?'No encontramos esa matrícula. Crea tu cuenta primero.':u.pass!==v.pass?'La contraseña no coincide. Revísala e intenta de nuevo.':'';if(A.err)auth();else enter(u)}
else if(d.a==='reg'){const nm=(v.name||'').trim(),mt=(v.mat||'').trim(),ml=(v.mail||'').trim();
A.err=nm.length<3?'Escribe tu nombre completo.':!MAT.test(mt)?'La matrícula debe tener 9 dígitos.':!MAIL.test(ml)?'Usa tu correo institucional, el que termina en unison.mx.':(v.pass||'').length<8?'La contraseña necesita al menos 8 caracteres.':U[mt]?'Esa matrícula ya tiene cuenta. Inicia sesión.':'';
if(A.err)auth();else{A.pend={name:nm,mat:mt,mail:ml,pass:v.pass};A.v={};A.step='code';auth()}}
else if(d.a==='verify'){if((v.code||'').trim()==='123456'){U[A.pend.mat]=A.pend;enter(A.pend)}else{A.err='Código incorrecto. Revisa tu correo e inténtalo de nuevo.';auth()}}
else if(d.a==='back'){A.step='form';A.m='reg';A.err='';A.v={name:A.pend.name,mat:A.pend.mat,mail:A.pend.mail};auth()}
else if(d.a==='forgot')toast('Te enviaremos un enlace a tu correo institucional.')
else if(d.a==='demo'){A.v={mat:'222200123',pass:'demo1234'};A.err='';auth()}});
$('auth').addEventListener('input',e=>{if(e.target.name)A.v[e.target.name]=e.target.value});
$('auth').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.name){const c=$('auth').querySelector('.cta');if(c)c.click()}});
$('out').innerHTML=icon('out');
$('out').onclick=()=>{me=null;A.m='login';A.step='form';A.err='';A.v={};auth();$('auth').classList.remove('out')};
auth();
setTimeout(()=>$('splash').classList.add('out'),matchMedia('(prefers-reduced-motion: reduce)').matches?500:2300);
render();
</script>
</body>
